name: Build IPA (sin firmar)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Compilar para iOS (sin firmar)
        run: flutter build ios --release --no-codesign

      - name: Empaquetar IPA
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr VideoDownloader-Converter-unsigned.ipa Payload

      - name: Subir IPA (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-Converter-unsigned-ipa
          path: VideoDownloader-Converter-unsigned.ipa
          retention-days: 30
